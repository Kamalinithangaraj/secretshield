
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secretshield"
version = "0.1.0"
description = "Shared secret-scanning engine for local Git protection and an online dashboard."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "PyJWT>=2.10",
    "cryptography>=44.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
secretshield = "secretshield.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["secretshield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
